<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>RaiSakshya - Teachers Presence</title>
  <!-- Tailwind CSS v3 with Plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            status: {
              presentBg: '#e8faf4',
              presentText: '#00a86b',
              absentBg: '#feeceb',
              absentText: '#f04438',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at 10% 15%, #f6fcfb 0%, #eef8f5 40%, #e5f5f0 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased selection:bg-teal-500 selection:text-white pb-16 min-h-screen flex flex-col justify-start">

  <!-- Fixed Top Global Navbar -->
  <div id="global-navbar" class="sticky top-0 z-[99999] w-full"></div>

  <div class="w-full max-w-[1480px] mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 flex flex-col gap-6">

  <!-- Hero Header Section -->
  <section class="relative z-10 flex flex-col lg:flex-row items-start lg:items-end justify-between mb-6 pb-2">
    <!-- Title & Search Side -->
    <div class="w-full lg:max-w-xl z-10 pt-2">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl sm:text-4xl lg:text-[42px] font-extrabold text-[#0a1f2b] tracking-tight leading-none">
          Teachers
        </h1>
        <span id="teachers-count-badge" class="px-3 py-1 rounded-full text-xs font-extrabold bg-teal-100 text-teal-800 border border-teal-200">
          Faculty Directory
        </span>
      </div>
      <p class="text-sm sm:text-base text-slate-500 font-medium mt-2 mb-5">
        Live presence tracker of college professors, cabins, and teaching schedules.
      </p>

      <!-- Live Search Bar -->
      <div class="relative w-full max-w-md">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <input id="teacher-search-input" oninput="onSearchOrFilterChange()" class="w-full pl-11 pr-10 py-3 bg-white/95 rounded-2xl border border-slate-200 text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 shadow-sm transition" placeholder="Search by teacher name, cabin, or subject..." type="text"/>
        <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-circle-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Department Filters & Presence Status Toggles -->
    <div class="flex flex-col gap-2.5 mt-4 lg:mt-0 w-full lg:w-auto z-10">
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="setDeptFilter('All')" class="dept-btn px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-[#0B1522] text-white shadow-sm" data-dept="All">All Departments</button>
        <button onclick="setDeptFilter('Computer Engineering')" class="dept-btn px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-white/80 hover:bg-white text-slate-600 border border-slate-200" data-dept="Computer Engineering">Computer Eng</button>
        <button onclick="setDeptFilter('Information Technology')" class="dept-btn px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-white/80 hover:bg-white text-slate-600 border border-slate-200" data-dept="Information Technology">IT</button>
        <button onclick="setDeptFilter('AI & Data Science')" class="dept-btn px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-white/80 hover:bg-white text-slate-600 border border-slate-200" data-dept="AI & Data Science">AI & Data</button>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="setStatusFilter('ALL')" class="status-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-200 text-slate-800" data-status="ALL">All Status</button>
        <button onclick="setStatusFilter('PRESENT')" class="status-btn px-3 py-1 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200" data-status="PRESENT">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1"></span> Present
        </button>
        <button onclick="setStatusFilter('ABSENT')" class="status-btn px-3 py-1 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200" data-status="ABSENT">
          <span class="w-2 h-2 rounded-full bg-rose-500 inline-block mr-1"></span> Absent
        </button>
      </div>
    </div>
  </section>

  <!-- Teacher Cards Grid -->
  <main id="teachers-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 pt-2">
    <!-- Populated dynamically via JS -->
    <div class="col-span-full py-16 text-center text-slate-400 text-sm">
    </div>
  </main>

</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/navbar.js"></script>
<script>
  renderGlobalNavbar('student', 'teachers');

  let allTeachers = [];
  let selectedDept = 'All';
  let selectedStatus = 'ALL';

  async function loadTeachers() {
    try {
      const res = await API.getTeachersList();
      allTeachers = res.teachers || [];
      renderTeachers();
    } catch (e) {
      console.error(e);
      document.getElementById('teachers-grid').innerHTML = `<div class="col-span-full text-center py-10 text-rose-500">Failed to load teachers.</div>`;
    }
  }

  function renderTeachers() {
    const grid = document.getElementById('teachers-grid');
    const searchVal = (document.getElementById('teacher-search-input').value || '').toLowerCase().trim();
    const clearBtn = document.getElementById('clear-search-btn');
    if (clearBtn) clearBtn.classList.toggle('hidden', searchVal.length === 0);

    let filtered = allTeachers.filter(t => {
      // Dept filter
      if (selectedDept !== 'All' && !t.department.toLowerCase().includes(selectedDept.toLowerCase())) return false;
      // Status filter
      if (selectedStatus !== 'ALL' && t.status_college !== selectedStatus) return false;
      // Search filter
      if (searchVal) {
        const matchesName = (t.name || '').toLowerCase().includes(searchVal);
        const matchesEmp = (t.employee_id || '').toLowerCase().includes(searchVal);
        const matchesCabin = (t.cabin || '').toLowerCase().includes(searchVal);
        const matchesDept = (t.department || '').toLowerCase().includes(searchVal);
        const matchesSubj = (t.subjects || []).some(s => s.toLowerCase().includes(searchVal));
        if (!matchesName && !matchesEmp && !matchesCabin && !matchesDept && !matchesSubj) return false;
      }
      return true;
    });

    // Update count badge
    document.getElementById('teachers-count-badge').textContent = `${filtered.length} Teachers`;

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="col-span-full py-16 text-center text-slate-400 bg-white/60 rounded-3xl border border-slate-200">
          <i class="fa-solid fa-user-slash text-3xl mb-2 text-slate-300"></i>
          <h4 class="text-base font-bold text-slate-700">No teachers found</h4>
          <p class="text-xs text-slate-400 mt-1">Try adjusting your search query or department filters.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = filtered.map(t => {
      const isPresent = t.status_college === 'PRESENT';
      const statusBadge = isPresent ? `
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold bg-[#e8faf4] text-[#00a86b] border border-emerald-200 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-[#00a86b] mr-1.5 animate-pulse"></span>
          Present · ${t.check_in_time || '08:45 AM'}
        </span>
      ` : `
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold bg-[#feeceb] text-[#f04438] border border-rose-200 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-[#f04438] mr-1.5"></span>
          Absent
        </span>
      `;

      const subjectsStr = (t.subjects || []).join(', ') || 'Core Subjects';

      return `
        <article onclick="openTeacherProfile('${t.id}')" class="bg-white rounded-[28px] p-5 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-100 flex flex-col justify-between hover:shadow-xl hover:-translate-y-1 hover:border-teal-300 transition-all duration-300 group cursor-pointer">
          <!-- Top Row: Status Badge & Cabin -->
          <div class="flex items-center justify-between w-full mb-2">
            <span class="text-[11px] font-bold text-slate-400 flex items-center gap-1">
              <i class="fa-regular fa-building text-[10px]"></i> ${t.cabin || 'Faculty Cabin'}
            </span>
            ${statusBadge}
          </div>

          <!-- 3D Avatar Center Graphic -->
          <div class="w-full h-44 sm:h-48 flex items-center justify-center my-1 relative">
            <img alt="${t.name}" class="max-h-full w-auto object-contain drop-shadow-md group-hover:scale-105 transition-transform duration-300" src="${t.avatar || '/static/teacher_faces/20bb28b4-f54a-4a3c-9630-e75ad391e672.png'}"/>
          </div>

          <!-- Bottom Information -->
          <div class="mt-3 pt-3 border-t border-slate-100 text-left">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-extrabold text-slate-900 tracking-tight leading-snug group-hover:text-teal-700 transition-colors">${t.name}</h2>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${t.employee_id}</span>
            </div>
            <p class="text-xs text-teal-600 font-bold mt-1 line-clamp-1">${subjectsStr}</p>
            <div class="flex items-center justify-between mt-1 pt-1">
              <p class="text-[11px] text-slate-400 font-medium">${t.department} · ${t.designation || 'Faculty'}</p>
              <span class="text-[11px] font-extrabold text-teal-600 group-hover:text-teal-700 flex items-center gap-1">
                View Profile <i class="fa-solid fa-arrow-right text-[9px] group-hover:translate-x-0.5 transition-transform"></i>
              </span>
            </div>
          </div>
        </article>
      `;
    }).join('');
  }

  function openTeacherProfile(teacherId) {
    window.location.href = `/student/teacher-profile?teacher_id=${teacherId}`;
  }

  function setDeptFilter(dept) {
    selectedDept = dept;
    document.querySelectorAll('.dept-btn').forEach(btn => {
      const match = btn.getAttribute('data-dept') === dept;
      btn.className = match
        ? 'dept-btn px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-[#0B1522] text-white shadow-sm'
        : 'dept-btn px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-white/80 hover:bg-white text-slate-600 border border-slate-200';
    });
    renderTeachers();
  }

  function setStatusFilter(status) {
    selectedStatus = status;
    document.querySelectorAll('.status-btn').forEach(btn => {
      const match = btn.getAttribute('data-status') === status;
      btn.className = match
        ? 'status-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-200 text-slate-800'
        : 'status-btn px-3 py-1 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200';
    });
    renderTeachers();
  }

  function onSearchOrFilterChange() {
    renderTeachers();
  }

  function clearSearch() {
    document.getElementById('teacher-search-input').value = '';
    renderTeachers();
  }

  window.onload = loadTeachers;
</script>
</body>
</html>
